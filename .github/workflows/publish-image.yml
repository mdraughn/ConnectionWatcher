# Builds and pushes the multi-arch container image to GHCR. Two channels:
#   edge    - every master push (the testing channel; what Mark runs at home)
#   X.Y.Z   - a v* tag: semver tags (1.2.3, 1.2, 1) and `latest` for a
#             stable release; a pre-release tag (v1.2.3-rc1) gets only its
#             own tag and never moves `latest`.
# Every build also gets a sha-<commit> tag. The version inside the binary
# (header, /api/v1/health) comes from the tag; edge builds report
# Directory.Build.props' "<prefix>-dev+<sha>". Pushing uses the workflow's
# own GITHUB_TOKEN - no stored secrets.
name: publish-image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU only backs the runtime stage's apt-get on arm64; the .NET and
      # Vite stages cross-compile natively (see Dockerfile).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The release version is the tag minus its leading "v"; empty for edge.
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # flavor latest=auto (the default) adds `latest` only for a semver tag
      # without a pre-release suffix, and skips the major/minor patterns for
      # pre-releases.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/conwatch
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prune build history: every push leaves a sha-<commit> version plus its
      # per-arch and attestation manifests. Keep the version tags, latest and
      # edge, the newest 5 sha-* builds, and drop the rest (orphaned untagged
      # manifests included; the action understands multi-arch manifest lists,
      # so children of kept tags are never removed). First run (2026-09-25) was a
      # dry run: 40 of 75 versions, all old sha-* builds and orphaned manifests.
      - name: Prune old image versions
        if: github.ref == 'refs/heads/master'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: conwatch
          dry-run: false
          delete-tags: sha-*
          keep-n-tagged: 5
          exclude-tags: latest,edge,[0-9]*
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          token: ${{ secrets.GITHUB_TOKEN }}
