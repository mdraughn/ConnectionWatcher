# Cuts a release from a v* tag: builds the Windows installer on a Windows
# runner and attaches it to a GitHub Release with generated notes. A tag with
# a pre-release suffix (v1.2.3-rc1) becomes a GitHub pre-release. The
# container image for the same tag is published by publish-image.yml.
#
# To release: `git tag v1.2.3 && git push origin v1.2.3`. Then bump
# VersionPrefix in Directory.Build.props so dev builds announce the next one.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # OIDC token for azure/login (code signing)

jobs:
  installer:
    runs-on: windows-latest
    # The `release` environment is what the app registration's federated
    # credential trusts (subject repo:<owner>/<repo>:environment:release).
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - id: ver
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      # Code signing: Azure Artifact Signing, authenticated with a federated
      # (OIDC) credential on the conwatch-release-signing app registration.
      # The three IDs are identifiers, not secrets; they live in repository
      # secrets so they stay out of logs.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch signing tools
        shell: pwsh
        run: .\deploy\windows\Get-SigningTools.ps1

      - name: Build and sign installer
        shell: pwsh
        run: .\Build-Installer.ps1 -Version ${{ steps.ver.outputs.version }} -Sign

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/ConnectionWatcher-Setup-*.exe
            dist/ConnectionWatcher-*-win-x64.zip
          if-no-files-found: error

  release:
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ConnectionWatcher-Setup-*.exe
            dist/ConnectionWatcher-*-win-x64.zip
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            **Container:** `docker pull ghcr.io/${{ github.repository_owner }}/conwatch:${{ steps.ver.outputs.version }}`
            (multi-arch: amd64 + arm64). A stable release also moves `latest`.

            **Windows:** `ConnectionWatcher-Setup-${{ steps.ver.outputs.version }}.exe` (wizard) or
            `ConnectionWatcher-${{ steps.ver.outputs.version }}-win-x64.zip` (unzip, then `conwatch service install`).
            Both are code-signed (Azure Artifact Signing, publisher "Mark Draughn"); a new certificate has little SmartScreen reputation at first, so Windows may still ask you to confirm.
            Upgrading from 0.9: the installer replaces `ConWatch.exe`/`ConTray.exe` with `conwatch.exe`/`conwatch-tray.exe`,
            re-registers the service, and moves your tray URL into the new config file automatically.
