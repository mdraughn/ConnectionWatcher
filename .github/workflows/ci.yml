# Test gate for pushes and PRs. The tray is Windows-only (WPF), so tests
# run per-project rather than via the solution on the Linux runner.
# The runner has Docker, so NotifierIntegrationTests' MQTT cases run
# against a real Mosquitto container here (they skip where Docker is down).
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: dotnet test Tests/ConEngine.Tests -c Debug
      - run: dotnet test Tests/ConPersistence.Tests -c Debug
      - run: dotnet test Tests/ConWatch.Tests -c Debug
      - run: dotnet test Tests/ConConfig.Tests -c Debug
      - run: dotnet test Tests/ConWatchCli.Tests -c Debug

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Programs/ConWatch/ClientApp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Programs/ConWatch/ClientApp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
