global:
  scrape_interval: 5s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Scrape metrics exposed by the OTel Collector
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
