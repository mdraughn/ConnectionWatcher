# ConnectionWatcher on Docker / Synology Container Manager.
#
#   cd deploy/docker && docker compose up -d
#
# The image runs as root by default, so ICMP ping works out of the box.
# If you harden it with a non-root user, keep cap_add: NET_RAW so ping and
# the TTL-stepped traceroute keep working.
#
# NOTE (Synology): create the ./data folder yourself before first start —
# Synology's Docker does not auto-create bind-mount folders ("Bind mount
# failed"). The host-side port (left of the colon) is yours to choose.

services:
  conwatch:
    # Published by .github/workflows/publish-image.yml (amd64 + arm64).
    # While the package is private, log the registry in first:
    #   docker login ghcr.io   (username + a PAT with read:packages)
    # To build from source instead, replace `image:` with:
    #   build: { context: ../.. }
    image: ghcr.io/mdraughn/conwatch:latest
    container_name: conwatch
    restart: unless-stopped
    # The app writes its last minute of data on the way out; give it time.
    # Synology Container Manager reads this from the compose file (there is
    # no UI for it). Docker's default is 10 s.
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    cap_add:
      - NET_RAW
